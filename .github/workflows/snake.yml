name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main   # ඔයාගේ branch එක main නෙවෙයි නම් මෙතන change කරන්න

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: gh-pages
          build_dir: dist   # ⚠️ React/Vite නම් dist, CRA නම් build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
